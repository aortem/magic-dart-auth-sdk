stages:
  - analyze

analyze_flutter_web:
  stage: analyze
  image: ghcr.io/cirruslabs/flutter:stable
  before_script:
    - |
      # Temporary until ghcr.io/cirruslabs/flutter:stable includes Flutter 3.47.5.
      FLUTTER_TARGET_VERSION=3.47.5
      export FLUTTER_ROOT="${FLUTTER_ROOT:-${FLUTTER_HOME:-$HOME/sdks/flutter}}"
      if ! flutter --version | grep -q "Flutter ${FLUTTER_TARGET_VERSION}"; then
        git -C "$FLUTTER_ROOT" fetch --depth 1 origin "refs/tags/${FLUTTER_TARGET_VERSION}:refs/tags/${FLUTTER_TARGET_VERSION}"
        git -C "$FLUTTER_ROOT" checkout --force "$FLUTTER_TARGET_VERSION"
      fi
      flutter --version
  script:
    - cd magic-dart-auth-sdk/example/magic-dart-auth-sdk-flutter-web-app
    - flutter pub get
    - flutter analyze
    - flutter test
    - flutter build web
  rules:
    - when: always
